
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sithunima V. | Contact</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

</head>

<body>

    <!-- HEADER -->
    <header class="glass">

        <nav class="navbar container">

            <div class="logo">
                Sithunima V.
            </div>

            <div class="menu-btn" id="menu-btn">
                <i class="fa-solid fa-bars"></i>
            </div>

            <ul class="nav-links" id="nav-links">

                <li><a href="index.html">Home</a></li>

                <li><a href="about.html">About</a></li>

                <li><a href="projects.html">Projects</a></li>

                <li><a href="contact.html">Contact</a></li>

            </ul>

        </nav>

    </header>

    <!-- MAIN -->
    <main class="container">

        <!-- TITLE -->
        <section class="glass page-banner">

            <h1>Contact Me</h1>

            <p>
                For Inquiries….
            </p>

        </section>

        <!-- CONTACT GRID -->
        <section class="contact-grid">

            <!-- FORM -->
            <article class="glass form-box">

                <h2>Send Message</h2>

                <form>

                    <label>Full Name*</label>

                    <input type="text"
                    placeholder="Enter your full name">

                    <label>Email Address*</label>

                    <input type="email"
                    placeholder="Enter your email">

                    <label>Purpose / Message*</label>

                    <textarea rows="6"
                    placeholder="Write your message"></textarea>

                    <button type="submit" class="btn">
                        Submit
                    </button>

                </form>

            </article>

            <!-- INFO -->
            <article class="glass info-box">

                <div class="profile-circle">
                    My Image
                </div>

                <div class="contact-info">

                    <p>
                        <i class="fa-solid fa-envelope"></i>
                        163cdsi2021@gmail.com
                    </p>

                    <p>
                        <i class="fa-solid fa-phone"></i>
                        926596352
                    </p>

                    <p>
                        <i class="fa-solid fa-location-dot"></i>
                        Colombo, Sri Lanka
                    </p>

                </div>

                <!-- SOCIAL -->
                <div class="social-icons">

                    <i class="fa-brands fa-facebook"></i>

                    <i class="fa-brands fa-instagram"></i>

                    <i class="fa-brands fa-linkedin"></i>

                </div>

            </article>

        </section>

    </main>

    <!-- FOOTER -->
    <footer class="glass footer">

        <p>
            © 2026 Sithunima V. | Portfolio Website
        </p>

    </footer>

    <script src="script.js"></script>

</body>
</html>
